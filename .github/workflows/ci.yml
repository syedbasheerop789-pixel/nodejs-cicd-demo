name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-docker:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build Docker Image
      run: docker build -t syedbasheerdevops/nodejs-cicd-demo:latest .